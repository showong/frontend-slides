<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가능성을 연결하는 금융 | 신용보증기금</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* === CSS VARIABLES === */
:root {
  --bg-deep:   #070D1A;
  --bg-navy:   #0D1628;
  --bg-card:   #111D35;
  --coral:     #FF6B35;
  --teal:      #4ECDC4;
  --gold:      #FFD166;
  --white:     #FFFFFF;
  --light:     #B8C5E0;
  --muted:     #6B7FA3;
  --divider:   rgba(255,255,255,0.08);
  --fd:        'Black Han Sans', sans-serif;
  --fb:        'Noto Sans KR', sans-serif;
  --ease:      cubic-bezier(0.16,1,0.3,1);

  /* viewport-base.css variables */
  --title-size:   clamp(1.5rem, 5vw, 4rem);
  --h2-size:      clamp(1.25rem, 3.5vw, 2.5rem);
  --h3-size:      clamp(1rem, 2.5vw, 1.75rem);
  --body-size:    clamp(0.75rem, 1.5vw, 1.125rem);
  --small-size:   clamp(0.65rem, 1vw, 0.875rem);
  --pad:          clamp(1rem, 4vw, 4rem);
  --gap:          clamp(0.5rem, 2vw, 2rem);
  --egap:         clamp(0.25rem, 1vw, 1rem);
}

/* === RESET === */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

/* === viewport-base.css === */
html,body { height:100%; overflow-x:hidden; }
html { scroll-snap-type:y mandatory; scroll-behavior:smooth; }
body { font-family:var(--fb); background:var(--bg-deep); color:var(--white); }

.slide {
  width:100vw; height:100vh; height:100dvh;
  overflow:hidden; scroll-snap-align:start;
  display:flex; flex-direction:column; position:relative;
}
.slide-content {
  flex:1; display:flex; flex-direction:column;
  justify-content:center; max-height:100%;
  overflow:hidden; padding:var(--pad);
}

@media(max-height:700px){
  :root{ --pad:clamp(0.75rem,3vw,2rem); --gap:clamp(0.4rem,1.5vw,1rem);
         --title-size:clamp(1.25rem,4.5vw,2.5rem); --h2-size:clamp(1rem,3vw,1.75rem); }
}
@media(max-height:600px){
  :root{ --pad:clamp(0.5rem,2.5vw,1.5rem); --body-size:clamp(0.7rem,1.2vw,0.95rem); }
  .nav-dots,.decorative{ display:none; }
}
@media(max-height:500px){
  :root{ --pad:clamp(0.4rem,2vw,1rem); --title-size:clamp(1rem,3.5vw,1.5rem); }
}
@media(max-width:600px){
  :root{ --title-size:clamp(1.25rem,7vw,2.5rem); }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:0.01ms!important; transition-duration:0.2s!important; }
  html{ scroll-behavior:auto; }
}

/* === ANIMATIONS === */
.reveal {
  opacity:0; transform:translateY(28px);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.slide.visible .reveal { opacity:1; transform:translateY(0); }
.reveal:nth-child(1){ transition-delay:0.05s; }
.reveal:nth-child(2){ transition-delay:0.15s; }
.reveal:nth-child(3){ transition-delay:0.25s; }
.reveal:nth-child(4){ transition-delay:0.35s; }
.reveal:nth-child(5){ transition-delay:0.45s; }
.reveal:nth-child(6){ transition-delay:0.55s; }

/* === PROGRESS BAR === */
.progress-bar {
  position:fixed; top:0; left:0; height:3px;
  background:linear-gradient(90deg,var(--coral),var(--teal));
  z-index:1000; transition:width 0.3s ease; width:0%;
}

/* === NAV DOTS === */
.nav-dots {
  position:fixed; right:clamp(0.75rem,2vw,1.5rem); top:50%;
  transform:translateY(-50%);
  display:flex; flex-direction:column; gap:0.5rem; z-index:1000;
}
.nav-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--muted); cursor:pointer; border:none;
  transition:all 0.3s ease;
}
.nav-dot.active { background:var(--coral); transform:scale(1.5); }

/* === SLIDE NUMBER === */
.slide-num {
  position:absolute; bottom:clamp(0.75rem,1.5vw,1.5rem);
  right:clamp(1rem,2vw,2rem);
  font-size:var(--small-size); color:var(--muted);
}

/* === BG UTILS === */
.bg-grid {
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
  background-size:60px 60px;
}
.glow {
  position:absolute; border-radius:50%; pointer-events:none;
}
.glow-coral { background:radial-gradient(circle,rgba(255,107,53,0.15) 0%,transparent 70%); }
.glow-teal  { background:radial-gradient(circle,rgba(78,205,196,0.12) 0%,transparent 70%); }

/* === ACCENT LINE === */
.accent-line {
  width:clamp(2rem,5vw,3.5rem); height:4px;
  background:linear-gradient(90deg,var(--coral),var(--teal));
  border-radius:2px; margin-bottom:var(--gap);
}

/* === SECTION LABEL === */
.section-label {
  display:inline-flex; align-items:center; gap:0.5rem;
  font-size:var(--small-size); color:var(--coral);
  letter-spacing:0.15em; text-transform:uppercase; font-weight:700;
  margin-bottom:var(--egap);
}
.section-label::before {
  content:''; display:block; width:1.2rem; height:2px; background:var(--coral);
}

/* ============================================================
   SLIDE 1 — TITLE
   ============================================================ */
.s1 { background:var(--bg-deep); }

.s1-badge {
  display:inline-flex; align-items:center; gap:0.5rem;
  background:rgba(255,107,53,0.12); border:1px solid rgba(255,107,53,0.28);
  color:var(--coral); font-size:var(--small-size); font-weight:700;
  padding:0.35em 1em; border-radius:2rem; letter-spacing:0.08em;
  width:fit-content; margin-bottom:var(--gap);
}
.s1-title {
  font-family:var(--fd); font-size:clamp(2rem,7vw,5.5rem);
  line-height:1.1; color:var(--white); margin-bottom:0.35em;
}
.s1-title em { color:var(--coral); font-style:normal; }
.s1-sub {
  font-size:clamp(0.85rem,2vw,1.3rem); color:var(--light);
  font-weight:400; line-height:1.65; margin-bottom:var(--gap); max-width:50ch;
}
.s1-meta {
  display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap;
}
.s1-meta-item { font-size:var(--small-size); color:var(--muted); }
.s1-meta-sep { width:1px; height:0.9em; background:var(--muted); }

/* decorative large character */
.s1-deco {
  position:absolute; right:clamp(2rem,6vw,8rem); top:50%;
  transform:translateY(-50%);
  font-family:var(--fd); font-size:clamp(8rem,22vw,20rem);
  color:rgba(255,107,53,0.04); line-height:1; user-select:none;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>
<nav class="nav-dots" id="navDots" aria-label="슬라이드 네비게이션"></nav>

<!-- ============================================================
     SLIDE 1 — TITLE
     ============================================================ -->
<section class="slide s1" id="slide-1">
  <div class="bg-grid"></div>
  <div class="glow glow-coral" style="width:45vw;height:45vw;top:-10%;left:-8%;"></div>
  <div class="glow glow-teal"  style="width:35vw;height:35vw;bottom:-8%;right:25%;"></div>
  <div class="s1-deco">신</div>

  <div class="slide-content">
    <div class="s1-badge reveal">금융이지 특강 · 신용보증기금</div>
    <h1 class="s1-title reveal">가능성을 <em>연결</em>하는 금융</h1>
    <p class="s1-sub reveal">한 회사를 키우고 지키는<br>신용보증기금의 역할</p>
    <div class="accent-line reveal"></div>
    <div class="s1-meta reveal">
      <span class="s1-meta-item">1시간 특강</span>
      <span class="s1-meta-sep"></span>
      <span class="s1-meta-item">창업 · 성장 · 위기관리 · 재기</span>
      <span class="s1-meta-sep"></span>
      <span class="s1-meta-item">2026</span>
    </div>
  </div>
  <span class="slide-num">01 / 09</span>
</section>

<script>
class SlidePresentation {
  constructor() {
    this.slides = Array.from(document.querySelectorAll('.slide'));
    this.total = this.slides.length;
    this.current = 0;
    this.pb = document.getElementById('progressBar');
    this.nd = document.getElementById('navDots');
    this._lastWheel = 0;
    this._touchY = 0;
    this.init();
  }
  init() {
    this.buildDots();
    this.observe();
    this.keys();
    this.touch();
    this.wheel();
    this.slides[0].classList.add('visible');
    this.updateUI(0);
  }
  buildDots() {
    this.nd.innerHTML = '';
    this.slides.forEach((_,i) => {
      const d = document.createElement('button');
      d.className = 'nav-dot'; d.setAttribute('aria-label', `슬라이드 ${i+1}`);
      d.onclick = () => this.go(i);
      this.nd.appendChild(d);
    });
  }
  observe() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          const i = this.slides.indexOf(e.target);
          if (i >= 0) { this.current = i; this.updateUI(i); }
        }
      });
    }, { threshold: 0.5 });
    this.slides.forEach(s => io.observe(s));
  }
  updateUI(i) {
    const pct = this.total > 1 ? (i / (this.total-1)) * 100 : 100;
    this.pb.style.width = pct + '%';
    this.nd.querySelectorAll('.nav-dot').forEach((d,j) => d.classList.toggle('active', j===i));
  }
  go(i) {
    if (i < 0 || i >= this.total) return;
    this.slides[i].scrollIntoView({ behavior:'smooth' });
  }
  keys() {
    document.addEventListener('keydown', e => {
      if (['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)) { e.preventDefault(); this.go(this.current+1); }
      if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key))          { e.preventDefault(); this.go(this.current-1); }
      if (e.key==='Home') this.go(0);
      if (e.key==='End')  this.go(this.total-1);
    });
  }
  touch() {
    document.addEventListener('touchstart', e => { this._touchY = e.touches[0].clientY; }, {passive:true});
    document.addEventListener('touchend',   e => {
      const dy = this._touchY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 50) this.go(dy > 0 ? this.current+1 : this.current-1);
    }, {passive:true});
  }
  wheel() {
    document.addEventListener('wheel', e => {
      const now = Date.now();
      if (now - this._lastWheel < 800) return;
      this._lastWheel = now;
      this.go(e.deltaY > 0 ? this.current+1 : this.current-1);
    }, {passive:true});
  }
}
new SlidePresentation();
</script>
</body>
</html>
